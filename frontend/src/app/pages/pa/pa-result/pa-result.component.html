<div class="vpr-page">
  <div class="vpr-search-card">
    <div class="vpr-search-row">
      <div class="vpr-field">
        <label class="vpr-inline-label">{{ i18n.t('pa.result.paySchedule', 'Kế hoạch trả lương') }}</label>
        <nz-select class="vpr-full" [ngModel]="searchPayScheduleNo()" (ngModelChange)="searchPayScheduleNo.set($event)" nzShowSearch>
          <nz-option *ngFor="let sch of payScheduleOptions()" [nzValue]="sch.payScheduleNo" [nzLabel]="scheduleLabel(sch)"></nz-option>
        </nz-select>
      </div>
      <div class="vpr-field">
        <label class="vpr-inline-label">{{ i18n.t('pa.result.dept', 'Phòng ban') }}</label>
        <nz-tree-select
          class="vpr-full"
          [nzNodes]="deptTreeNodes()"
          [ngModel]="searchDeptNo()"
          (ngModelChange)="searchDeptNo.set($event)"
          nzShowSearch
          nzAllowClear
          [nzPlaceHolder]="i18n.t('pa.result.deptPlaceholder', 'Chọn phòng ban')"
        ></nz-tree-select>
      </div>
    </div>
    <div class="vpr-search-row">
      <div class="vpr-field">
        <label class="vpr-inline-label">{{ i18n.t('pa.result.isUse', 'Hạng mục tích chọn') }}</label>
        <nz-select class="vpr-full" [ngModel]="isUse()" (ngModelChange)="isUse.set($event)">
          <nz-option *ngFor="let v of isUseOptions" [nzValue]="v" [nzLabel]="i18n.t('pa.result.isUse.' + v, '')"></nz-option>
        </nz-select>
      </div>
      <div class="vpr-field">
        <label class="vpr-inline-label">{{ i18n.t('pa.result.itemType', 'Phân biệt hạng mục') }}</label>
        <nz-select class="vpr-full" [ngModel]="itemType()" (ngModelChange)="itemType.set($event)">
          <nz-option *ngFor="let v of itemTypeOptions" [nzValue]="v" [nzLabel]="i18n.t('pa.result.itemType.' + v, '')"></nz-option>
        </nz-select>
      </div>
      <div class="vpr-search-actions">
        <ng-container *ngIf="canEdit()">
          <button nz-button nzType="primary" [nzLoading]="loading()" (click)="search()">
            <span nz-icon nzType="search"></span>{{ i18n.t('pa.result.search', 'Tra cứu') }}
          </button>
          <button nz-button [nzLoading]="saving()" (click)="save()">
            <span nz-icon nzType="save"></span>{{ i18n.t('pa.result.save', 'Lưu') }}
          </button>
        </ng-container>
        <button nz-button [nzLoading]="exporting()" (click)="exportExcel()">
          <span nz-icon nzType="file-excel"></span>{{ i18n.t('pa.result.exportExcel', 'Xuất Excel') }}
        </button>
      </div>
    </div>
  </div>

  <div class="vpr-quick-row">
    <label nz-checkbox [ngModel]="allChecked()" (ngModelChange)="toggleAll($event)">
      {{ i18n.t('pa.salary.title.allChecked', 'Chọn tất cả') }}
    </label>
    <label nz-checkbox [ngModel]="inverseChecked()" (ngModelChange)="toggleInverse($event)">
      {{ i18n.t('pa.salary.title.opsiteChecked', 'Chọn ngược') }}
    </label>
  </div>

  <div class="vpr-section" *ngFor="let section of sections()">
    <div class="vpr-section-header">
      <span>{{ i18n.t(section.titleKey, section.fallback) }}</span>
      <label
        nz-checkbox
        [ngModel]="sectionChecked(section)"
        [nzIndeterminate]="sectionIndeterminate(section)"
        (ngModelChange)="toggleSection(section, $event)"
      ></label>
    </div>
    <div class="vpr-section-body">
      <div class="vpr-item" *ngFor="let item of section.items">
        <label nz-checkbox [ngModel]="isChecked(item.itemId)" (ngModelChange)="toggleChecked(item.itemId, $event)"></label>
        <nz-input-number
          class="vpr-order-input"
          nzSize="small"
          [class.vpr-order-required]="isOrderMissing(item.itemId)"
          [ngModel]="orderNoOf(item.itemId)"
          (ngModelChange)="setOrderNo(item.itemId, $event)"
          [nzMin]="0"
          [nzMax]="99"
          [nzPrecision]="0"
        ></nz-input-number>
        <span class="vpr-item-name" [title]="itemLabel(item)">{{ itemLabel(item) }}</span>
      </div>
      <div *ngIf="!section.items.length" class="vpr-empty">{{ i18n.t('common.noData', 'Không có dữ liệu') }}</div>
    </div>
  </div>
</div>
