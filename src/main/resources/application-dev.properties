# Development Profile - DevTools Configuration
# restart.enabled=true de kich hoat ClassPathFileSystemWatcher - day la thanh phan
# theo doi thay doi file va phat ra su kien kich hoat LiveReload. Cac file trong
# static/** (bao gom static/ng - output cua Angular) da nam trong exclude mac dinh
# cua Spring Boot DevTools nen se KHONG lam restart lai app, chi trigger LiveReload.
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.devtools.livereload.port=35729

