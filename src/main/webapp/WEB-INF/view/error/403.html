<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/master :: master}">
<head>
    <title>Không có quyền truy cập - HR-11</title>
</head>
<body>
<div th:fragment="content">
    <div class="container-fluid">
        <div class="row justify-content-center mt-5">
            <div class="col-md-6">
                <div class="card shadow text-center">
                    <div class="card-body py-5">
                        <div class="mb-4">
                            <i class="fas fa-ban text-danger" style="font-size: 4rem;"></i>
                        </div>
                        <h1 class="display-4 text-danger mb-3">403</h1>
                        <h2 class="mb-3" th:text="#{error.403.title}">Không có quyền truy cập</h2>
                        <p class="lead mb-4" th:text="#{error.403.message}">Bạn không có quyền truy cập trang này, hoặc phiên đăng nhập đã hết hạn.</p>
                        <div class="d-flex justify-content-center gap-3">
                            <a href="/login" class="btn btn-outline-secondary">
                                <i class="fas fa-sign-in-alt me-1"></i>
                                <span th:text="#{login.button}">Đăng nhập</span>
                            </a>
                            <a href="/login/dashboard" class="btn btn-primary">
                                <i class="fas fa-home me-1"></i>
                                <span th:text="#{common.goHome}">Về trang chủ</span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
