<div th:fragment="content">
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-body">
                    <form id="aotbhae_searchForm" class="row g-3 mb-4">
                        <div class="col-md-3">
                            <label for="aotbhae_searchEmpKeyword" class="form-label" th:text="#{empSearch.field.keyword}">Mã nhân viên / Họ tên</label>
                            <div class="input-group">
                                <input type="text" class="form-control" id="aotbhae_searchEmpKeyword"
                                    th:placeholder="#{empSearch.placeholder.keyword}" placeholder="Nhập mã hoặc tên nhân viên"
                                    onkeydown="if(event.key==='Enter'){event.preventDefault();aotbhaeOpenEmpSearch();}">
                                <input type="hidden" id="aotbhae_searchEmpId">
                                <input type="hidden" id="aotbhae_searchEmpName">
                                <button class="btn btn-outline-secondary" type="button" onclick="aotbhaeOpenEmpSearch()" title="Tìm nhân viên">
                                    <i class="bx bx-search"></i>
                                </button>
                            </div>
                        </div>
                        <div class="col-md-2">
                            <label for="aotbhae_searchFromDate" class="form-label" th:text="#{common.fromDate}">Từ ngày</label>
                            <input type="date" class="form-control" id="aotbhae_searchFromDate">
                        </div>
                        <div class="col-md-2">
                            <label for="aotbhae_searchToDate" class="form-label" th:text="#{common.toDate}">Đến ngày</label>
                            <input type="date" class="form-control" id="aotbhae_searchToDate">
                        </div>
                        <div class="col-md-2">
                            <label for="aotbhae_searchAffirmFlag" class="form-label" th:text="#{arOtf.affirmFlag}">Trạng thái đơn tăng ca</label>
                            <select class="form-select" id="aotbhae_searchAffirmFlag">
                                <option value="" th:text="#{common.all}">Tất cả</option>
                                <option value="14014309" th:text="#{arOtf.affirmFlag.waitApprove}">Chờ duyệt</option>
                                <option value="14014308" th:text="#{arOtf.affirmFlag.approved}">Đã duyệt</option>
                                <option value="14014307" th:text="#{arOtf.affirmFlag.approving}">Đang duyệt</option>
                                <option value="14014306" th:text="#{arOtf.affirmFlag.sent}">Gửi</option>
                                <option value="14014310" th:text="#{arOtf.status.cancelled}">Đã hủy</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label for="aotbhae_searchConfirmFlag" class="form-label" th:text="#{arOtf.confirmFlag}">Trạng thái xác nhận</label>
                            <select class="form-select" id="aotbhae_searchConfirmFlag">
                                <option value="" th:text="#{common.all}">Tất cả</option>
                                <option value="0" th:text="#{arOtf.confirmFlag.notConfirmed}">Chưa xác nhận</option>
                                <option value="1" th:text="#{arOtf.confirmFlag.confirmed}">Đã xác nhận</option>
                                <option value="2" th:text="#{arOtf.confirmFlag.rejected}">Từ chối</option>
                            </select>
                        </div>
                        <div class="col-12 d-flex flex-wrap gap-1">
                            <button type="button" class="btn btn-primary" onclick="aotbhaeSearchData()">
                                <i class="bx bx-search"></i> <span th:text="#{common.search}">Tìm kiếm</span>
                            </button>
                            <button type="button" class="btn btn-secondary" onclick="aotbhaeClearSearch()">
                                <i class="bx bx-x"></i> <span th:text="#{common.clearFilter}">Xóa lọc</span>
                            </button>
                            <button type="button" class="btn btn-success" onclick="aotbhaeAddEmptyRow()">
                                <i class="bx bx-plus"></i> <span th:text="#{common.addNew}">Thêm mới</span>
                            </button>
                            <button type="button" class="btn btn-primary" onclick="aotbhaeSaveChecked()">
                                <i class="bx bx-save"></i> <span th:text="#{common.save}">Lưu</span>
                            </button>
                            <button type="button" class="btn btn-danger" onclick="aotbhaeCancelBatch()">
                                <i class="bx bx-x-circle"></i> <span th:text="#{arOtf.cancelBatch}">Hủy bỏ</span>
                            </button>
                            <button type="button" class="btn btn-info text-white" onclick="aotbhaeDownloadTemplate()">
                                <i class="bx bx-download"></i> <span th:text="#{common.downloadTemplate}">Tải File Mẫu</span>
                            </button>
                            <button type="button" class="btn btn-warning" onclick="aotbhaeOpenImportModal()">
                                <i class="bx bx-upload"></i> <span th:text="#{common.importExcel}">Import Excel</span>
                            </button>
                        </div>
                    </form>

                    <div class="table-responsive">
                        <table id="aotbhae_dataTable" class="table table-striped table-bordered table-hover"
                            style="min-width: 2600px;">
                            <thead class="table-light text-center align-middle">
                                <tr>
                                    <th><input type="checkbox" id="aotbhae_checkAll" onclick="aotbhaeToggleCheckAll(this)"></th>
                                    <th>No</th>
                                    <th style="width:250px;min-width:250px;max-width:250px;" th:text="#{common.empName}">Nhân viên</th>
                                    <th th:text="#{common.deptName}">Phòng ban</th>
                                    <th th:text="#{arOtf.otType}">Loại tăng ca</th>
                                    <th style="width:120px;min-width:120px;max-width:120px;" th:text="#{arOtf.otDate}">Ngày tăng ca</th>
                                    <th style="width:250px;min-width:150px;max-width:150px;" th:text="#{arOtf.fromHour}">Từ giờ</th>
                                    <th style="width:150px;min-width:150px;max-width:150px;" th:text="#{arOtf.toHour}">Đến giờ</th>
                                    <th th:text="#{ps.col.indoorTime}">Giờ vào</th>
                                    <th th:text="#{ps.col.outdoorTime}">Giờ ra</th>
                                    <th th:text="#{common.hours}">Số giờ</th>
                                    <th th:text="#{impOt.deductYn}">Báo cơm / Nghỉ ngơi (30')</th>
                                    <th style="width:250px;min-width:250px;max-width:250px;" th:text="#{common.reason}">Lý do</th>
                                    <th th:text="#{essOt.usecarYn}">Đặt xe</th>
                                    <th style="width:150px;" th:text="#{essOt.carAddress}">Tuyến xe</th>
                                    <th style="width:200px;" th:text="#{essOt.carAddressDetail}">Chi tiết điểm đón</th>
                                    <th th:text="#{arOtf.otTotalMonth}">Tổng tăng ca tháng này</th>
                                    <th th:text="#{arOtf.otTotalYear}">Tổng tăng ca năm này</th>
                                    <th th:text="#{common.status}">Trạng thái</th>
                                    <th th:text="#{common.creator}">Người tạo</th>
                                    <th th:text="#{common.updater}">Người sửa</th>
                                    <th th:text="#{common.approver}">Người duyệt</th>
                                    <th th:text="#{common.action}">Thao tác</th>

                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<template id="fragmentScripts">
    <th:block th:replace="~{ess/infoApply/viewApprovaledOt :: approvalOtScript}"></th:block>
    <script th:inline="javascript">
        var _aotbhae_i18n = {
            selectEmp: /*[[#{arOtf.selectEmp}]]*/ 'Chọn NV...',
            msgNotSelectEmp: /*[[#{arOtf.msg.notSelectEmp}]]*/ 'Chưa chọn nhân viên',
            msgNotSelectDate: /*[[#{arOtf.msg.notSelectDate}]]*/ 'Chưa chọn ngày tăng ca',
            msgNotEnterTime: /*[[#{arOtf.msg.notEnterTime}]]*/ 'Chưa nhập giờ tăng ca',
            msgNoHour: /*[[#{arOtf.msg.noHour}]]*/ 'Không tính được số giờ tăng ca',
            noEmpComp: /*[[#{arOtf.noEmpComp}]]*/ 'Chưa có component tìm nhân viên.',
            importResult: /*[[#{arOtf.importResult}]]*/ 'Kết quả nhập',
            cancelApply: /*[[#{arOtf.cancelApply}]]*/ 'Hủy đơn',
            statusCancelled: /*[[#{arOtf.status.cancelled}]]*/ 'Đã hủy',
            confirmCancelApply: /*[[#{arOtf.msg.confirmCancelApply}]]*/ 'Bạn có chắc chắn muốn hủy đơn tăng ca này không?',
            msgNotCheckCancel: /*[[#{arOtf.msg.notCheckCancel}]]*/ 'Vui lòng tích chọn ô hủy đơn trước khi thực hiện',
            cancelApplySuccess: /*[[#{arOtf.msg.cancelApplySuccess}]]*/ 'Hủy đơn tăng ca thành công',
            confirmCancelBatch: /*[[#{arOtf.msg.confirmCancelBatch}]]*/ 'Bạn có chắc chắn muốn hủy {n} đơn tăng ca đã chọn không?',
            cancelBatchSuccess: /*[[#{arOtf.msg.cancelBatchSuccess}]]*/ 'Đã hủy thành công {n} đơn tăng ca',
            noCancelSelected: /*[[#{arOtf.msg.noCancelSelected}]]*/ 'Vui lòng chọn ít nhất một đơn tăng ca để hủy',
            confirmResubmit: /*[[#{arOtf.msg.confirmResubmit}]]*/ 'Đơn này đã được duyệt. Lưu sẽ xóa đơn hiện tại và tạo lại đơn mới. Bạn có muốn tiếp tục không?',
            resubmitSuccess: /*[[#{arOtf.msg.resubmitSuccess}]]*/ 'Đã lưu lại đơn tăng ca thành công',
            msgNoCheckedRows: 'Vui lòng chọn ít nhất một dòng để lưu',
            saveBatchSuccess: 'Lưu thành công {n} dòng',
            saveBatchFailed: 'Một số dòng lưu thất bại'
        };

        var _aotbhae_table;
        var _aotbhae_addedRows = [];
        var _aotbhae_pageBooted = false;
        var _aotbhae_rowEventsBound = false;
        var _aotbhae_hrDeptManager = null;

        function aotbhaeFormatDate(dateObj) {
            var y = dateObj.getFullYear();
            var m = String(dateObj.getMonth() + 1).padStart(2, '0');
            var d = String(dateObj.getDate()).padStart(2, '0');
            return [y, m, d].join('-');
        }

        function aotbhaeInitDate() {
            var now = new Date();
            var day = now.getDay() || 7;
            var monday = new Date(now);
            monday.setDate(now.getDate() - day + 1);
            var sunday = new Date(now);
            sunday.setDate(now.getDate() - day + 7);
            $('#aotbhae_searchFromDate').val(aotbhaeFormatDate(monday));
            $('#aotbhae_searchToDate').val(aotbhaeFormatDate(sunday));
        }

        function aotbhaeEscHtml(value) {
            if (value === null || value === undefined) return '';
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function aotbhaeNormalizeDateTimeValue(rawValue) {
            if (!rawValue) return '';
            var normalized = String(rawValue).trim().replace('T', ' ');
            var parts = normalized.split(' ');
            if (parts.length < 2) return '';
            var datePart = parts[0];
            var timeParts = parts[1].split(':');
            if (timeParts.length < 2) return '';
            var hour = (timeParts[0] || '00').padStart(2, '0');
            var minute = (timeParts[1] || '00').padStart(2, '0');
            return datePart + ' ' + hour + ':' + minute;
        }

        function aotbhaeSplitDateTimeValue(rawValue) {
            var normalized = aotbhaeNormalizeDateTimeValue(rawValue);
            if (!normalized) return null;
            var parts = normalized.split(' ');
            if (parts.length < 2) return null;
            return { datePart: parts[0], timePart: parts[1] };
        }

        window.aotbhaeValidateMinutes = function (input) {
            if (!input || !input.value) return;
            var normalized = aotbhaeNormalizeDateTimeValue(input.value);
            if (!normalized) return;
            var parts = normalized.split(' ');
            var datePart = parts[0];
            var timeParts = parts[1].split(':');
            if (timeParts.length < 2) return;
            var hour = timeParts[0];
            var minute = parseInt(timeParts[1], 10);
            var allowedMinutes = [0, 2, 15, 17, 30, 32, 45, 47];
            if (allowedMinutes.indexOf(minute) === -1) {
                var closestMinute = 0;
                for (var i = allowedMinutes.length - 1; i >= 0; i--) {
                    if (minute >= allowedMinutes[i]) { closestMinute = allowedMinutes[i]; break; }
                }
                var formattedMinute = closestMinute < 10 ? '0' + closestMinute : closestMinute;
                input.value = datePart + ' ' + hour + ':' + formattedMinute;
                toastr && toastr.warning('Minute không hợp lệ, hệ thống đã tự động điều chỉnh về ' + formattedMinute);
            } else {
                input.value = datePart + ' ' + hour + ':' + (minute < 10 ? '0' + minute : minute);
            }
        };

        window.aotbhaeNormalizeDateTimePickerValue = function (input, currentValue) {
            return aotbhaeNormalizeDateTimeValue(currentValue);
        };

        window.aotbhaeHandleDateTimePickerApply = function (input) {
            aotbhaeValidateMinutes(input);
        };

        function aotbhaeInitInputPlugins(container) {
            if (typeof initDateRangePickers === 'function') initDateRangePickers(container);
        }

        window.aotbhaeDownloadTemplate = function () {
            window.location.href = '/sy/excel/api/downloadTemplate?templateName=OvertimeApply_add_Template';
        };

        window.aotbhaeOpenImportModal = function () {
            ExcelImport.open('/sy/excel/api/importTemplate?templateName=OvertimeApply_add_Template', function (res) {
                if (_aotbhae_table) _aotbhae_table.ajax.reload(null, false);
                if (typeof tabSystem !== 'undefined' && tabSystem && typeof tabSystem.openTab === 'function') {
                    tabSystem.openTab('/ar/attendanceMintenance/viewImportOtTempList', _aotbhae_i18n.importResult);
                } else {
                    window.open('/ar/attendanceMintenance/viewImportOtTempList', '_blank');
                }
            });
        };

        function aotbhaeParseDateTime(dateValue, timeValue) {
            var dateTimeParts = aotbhaeSplitDateTimeValue(timeValue);
            if (dateTimeParts) return new Date(dateTimeParts.datePart + 'T' + dateTimeParts.timePart + ':00');
            if (!dateValue || !timeValue) return null;
            return new Date(dateValue + 'T' + timeValue + ':00');
        }

        function aotbhaeCalcApplyHour(dateValue, fromTime, toTime) {
            var start = aotbhaeParseDateTime(dateValue, fromTime);
            var end = aotbhaeParseDateTime(dateValue, toTime);
            if (!start || !end || isNaN(start.getTime()) || isNaN(end.getTime())) return '';
            if (end < start) end.setDate(end.getDate() + 1);
            var diffMinutes = Math.round((end - start) / 60000);
            if (diffMinutes < 0) return '';
            var hours = (diffMinutes / 60).toFixed(2);
            return hours.replace(/\.00$/, '').replace(/(\.\d*[1-9])0$/, '$1');
        }

        function aotbhaeGetRowData($tr) {
            if (!_aotbhae_table) return null;
            return _aotbhae_table.row($tr).data() || null;
        }

        function aotbhaeCollectRowTimes($tr) {
            var fromDateTime = aotbhaeNormalizeDateTimeValue($tr.find('.aotbhae-in-from').val());
            var toDateTime = aotbhaeNormalizeDateTimeValue($tr.find('.aotbhae-in-to').val());
            return {
                fromDateTime: fromDateTime,
                toDateTime: toDateTime,
                fromParts: aotbhaeSplitDateTimeValue(fromDateTime),
                toParts: aotbhaeSplitDateTimeValue(toDateTime)
            };
        }

        function aotbhaeSyncRowData($tr) {
            var rowData = aotbhaeGetRowData($tr);
            if (!rowData) return null;
            var timeInfo = aotbhaeCollectRowTimes($tr);
            var applyOtDate = $tr.find('.aotbhae-in-date').val() || rowData.applyOtDate || '';
            if (timeInfo.fromParts && timeInfo.fromParts.datePart) {
                applyOtDate = timeInfo.fromParts.datePart;
                $tr.find('.aotbhae-in-date').val(applyOtDate);
            }
            rowData.personId = ($tr.find('.aotbhae-in-personid').val() || rowData.personId || '').trim();
            rowData.otTypeCode = $tr.find('.aotbhae-in-type-code').val() || '';
            rowData.otTypeName = $tr.find('.aotbhae-in-type-name').text() || rowData.otTypeName || '';
            rowData.applyOtDate = applyOtDate;
            rowData.otFromTime = timeInfo.fromDateTime;
            rowData.otToTime = timeInfo.toDateTime;
            rowData.otApplyHour = $tr.find('.aotbhae-apply-hour').text() || '';
            rowData.deductYn = $tr.find('.aotbhae-in-deduct').is(':checked') ? '1' : '0';
            rowData.applyOtRemark = $tr.find('.aotbhae-in-remark').val() || '';
            rowData.usecarYn = $tr.find('.aotbhae-in-usecar').is(':checked') ? '1' : '0';
            rowData.carAddress = $tr.find('.aotbhae-in-car-address').val() || rowData.carAddress || '';
            rowData.carAddressDetail = $tr.find('.aotbhae-in-car-detail').val() || rowData.carAddressDetail || '';
            return rowData;
        }

        function aotbhaeApplyDefaultOtInfo($tr, info) {
            var rowData = aotbhaeSyncRowData($tr) || {};
            var otTypeCode = info && info.otTypeCode ? info.otTypeCode : '';
            var otTypeName = info && info.otTypeName ? info.otTypeName : otTypeCode;
            var otApplyHour = info && info.otApplyHour ? info.otApplyHour : aotbhaeCalcApplyHour(
                rowData.applyOtDate, rowData.otFromTime, rowData.otToTime);
            $tr.find('.aotbhae-in-type-code').val(otTypeCode);
            $tr.find('.aotbhae-in-type-name').text(otTypeName || '');
            $tr.find('.aotbhae-apply-hour').text(otApplyHour || '');
            rowData.otTypeCode = otTypeCode;
            rowData.otTypeName = otTypeName || '';
            rowData.otApplyHour = otApplyHour || '';
        }

        function aotbhaeAutoFillByEmp($tr, personId, applyOtDate) {
            if (!personId || !applyOtDate) return;
            var rowData = aotbhaeGetRowData($tr);
            if (!rowData) return;
            var deductYn = $tr.find('.aotbhae-in-deduct').is(':checked') ? '1' : '0';
            $.ajax({
                url: '/ar/attendanceMintenance/api/overtime/auto-fill-by-emp',
                type: 'GET',
                data: { personId: personId, applyOtDate: applyOtDate, deductYn: deductYn },
                success: function (data) {
                    if (!data) return;
                    if (data.deptName) { rowData.deptName = data.deptName; $tr.find('td').eq(3).text(data.deptName); }
                    rowData.otTypeCode = data.otTypeCode || '';
                    rowData.otTypeName = data.otTypeName || '';
                    $tr.find('.aotbhae-in-type-code').val(data.otTypeCode || '');
                    $tr.find('.aotbhae-in-type-name').text(data.otTypeName || '');
                    var fromVal = aotbhaeNormalizeDateTimeValue(data.otFromTime || '');
                    var toVal = aotbhaeNormalizeDateTimeValue(data.otToTime || '');
                    if (fromVal) {
                        var $fromInput = $tr.find('.aotbhae-in-from');
                        $fromInput.val(fromVal);
                        rowData.otFromTime = fromVal;
                        if (typeof initDateRangePickers === 'function') initDateRangePickers($fromInput[0]);
                    }
                    if (toVal) {
                        var $toInput = $tr.find('.aotbhae-in-to');
                        $toInput.val(toVal);
                        rowData.otToTime = toVal;
                        if (typeof initDateRangePickers === 'function') initDateRangePickers($toInput[0]);
                    }
                    var applyHour = data.otApplyHour || '';
                    if (!applyHour && fromVal && toVal) applyHour = aotbhaeCalcApplyHour(applyOtDate, fromVal, toVal);
                    $tr.find('.aotbhae-apply-hour').text(applyHour || '');
                    rowData.otApplyHour = applyHour || '';
                    rowData.postFamily = data.postFamily || '';
                    rowData.shiftEndTime = data.shiftEndTime || '';
                }
            });
        }

        function aotbhaeFetchAndShowOtTotals($tr, personId, applyOtDate) {
            if (!personId || !applyOtDate) return;
            $.ajax({
                url: '/ar/attendanceMintenance/api/overtime/ot-totals',
                type: 'GET',
                data: { personId: personId, applyOtDate: applyOtDate },
                success: function (data) {
                    if (!data) return;
                    $tr.find('.aotbhae-total-month').text(data.otTotalMonth || '');
                    $tr.find('.aotbhae-total-year').text(data.otTotalYear || '');
                    var rowData = _aotbhae_table ? _aotbhae_table.row($tr).data() : null;
                    if (rowData) {
                        rowData.otTotalMonth = data.otTotalMonth || '';
                        rowData.otTotalYear = data.otTotalYear || '';
                    }
                }
            });
        }

        function aotbhaeResolveDefaultOtInfo($tr) {
            var rowData = aotbhaeSyncRowData($tr);
            if (!rowData) return;
            var personId = rowData.personId || '';
            var fromParts = aotbhaeSplitDateTimeValue(rowData.otFromTime);
            var toParts = aotbhaeSplitDateTimeValue(rowData.otToTime);
            var applyOtDate = rowData.applyOtDate || (fromParts ? fromParts.datePart : '');
            var otFromTime = fromParts ? fromParts.timePart : '';
            var otToTime = toParts ? toParts.timePart : '';
            if (!personId || !applyOtDate || !otFromTime || !otToTime) {
                $tr.find('.aotbhae-in-type-code').val('');
                $tr.find('.aotbhae-in-type-name').text('');
                $tr.find('.aotbhae-apply-hour').text(aotbhaeCalcApplyHour(applyOtDate, rowData.otFromTime, rowData.otToTime));
                rowData.otTypeCode = '';
                rowData.otTypeName = '';
                return;
            }
            var requestKey = [personId, applyOtDate, otFromTime, otToTime, rowData.deductYn || '0'].join('|');
            $tr.data('aotbhaeResolveKey', requestKey);
            $.ajax({
                url: '/ar/attendanceMintenance/api/overtime/default-info',
                type: 'GET',
                data: { personId: personId, applyOtDate: applyOtDate, otFromTime: otFromTime, otToTime: otToTime, deductYn: rowData.deductYn || '0' },
                success: function (res) {
                    if ($tr.data('aotbhaeResolveKey') !== requestKey) return;
                    aotbhaeApplyDefaultOtInfo($tr, res || {});
                },
                error: function () {
                    if ($tr.data('aotbhaeResolveKey') !== requestKey) return;
                    $tr.find('.aotbhae-apply-hour').text(aotbhaeCalcApplyHour(applyOtDate, otFromTime, otToTime));
                }
            });
        }

        function aotbhaeUpdateRowState($tr, shouldResolveDefault) {
            var dateValue = $tr.find('.aotbhae-in-date').val();
            var fromTime = $tr.find('.aotbhae-in-from').val();
            var toTime = $tr.find('.aotbhae-in-to').val();
            $tr.find('.aotbhae-apply-hour').text(aotbhaeCalcApplyHour(dateValue, fromTime, toTime) || '');
            aotbhaeSyncRowData($tr);
            if (shouldResolveDefault) aotbhaeResolveDefaultOtInfo($tr);
        }

        function aotbhaeBindRowEvents() {
            if (_aotbhae_rowEventsBound) return;
            _aotbhae_rowEventsBound = true;

                otToTime: timeInfo.toDateTime || '',
                otApplyHour: $tr.find('.aotbhae-apply-hour').text() || aotbhaeCalcApplyHour(
                    (timeInfo.fromParts && timeInfo.fromParts.datePart) || $tr.find('.aotbhae-in-date').val(),

                applyOtRemark: $tr.find('.aotbhae-in-remark').val()

        function aotbhaeValidateSaveContext(ctx) {
            if (!ctx.personId)    { toastr && toastr.warning(_aotbhae_i18n.msgNotSelectEmp);  return false; }
            if (!ctx.applyOtDate) { toastr && toastr.warning(_aotbhae_i18n.msgNotSelectDate); return false; }
            if (!ctx.otFromTime || !ctx.otToTime) { toastr && toastr.warning(_aotbhae_i18n.msgNotEnterTime); return false; }
            if (!ctx.otApplyHour) { toastr && toastr.warning(_aotbhae_i18n.msgNoHour); return false; }
            // Điều kiện 1: Lý do bắt buộc
            if (!ctx.applyOtRemark || !ctx.applyOtRemark.trim()) {
                toastr && toastr.warning('Vui lòng nhập lý do tăng ca');
                return false;
            }
            var otHour = parseFloat(ctx.otApplyHour);
            if (!isNaN(otHour)) {
                // Điều kiện 2: Thời lượng tối thiểu theo nhóm nhân viên
                var postFamily = ctx.rowData.postFamily || '';
                if (postFamily === '14015813' || postFamily === '14015814') {
                    if (otHour < 1) {
                        toastr && toastr.warning('Thời lượng tăng ca phải ít nhất 1 tiếng đối với nhóm nhân viên này');
                        return false;
                    }
                } else if (postFamily === '14015815') {
                    if (otHour < 0.5) {
                        toastr && toastr.warning('Thời lượng tăng ca phải ít nhất 30 phút đối với nhóm nhân viên này');
                        return false;
                    }
                }
                // Điều kiện 3: Thời lượng tối đa theo loại tăng ca
                var otTypeCode = ctx.otTypeCode || '';
                if (otTypeCode === '32') {
                    if (otHour > 3) {
                        toastr && toastr.warning('Ngày thường chỉ được tăng ca tối đa 3 tiếng');
                        return false;
                    }
                } else {
                    if (otHour > 12) {
                        toastr && toastr.warning('Thời lượng tăng ca không được quá 12 tiếng');
                        return false;
                    }
                }
            }
            if (ctx.rowData.isNew && (!ctx.rowData.approvers || !ctx.rowData.approvers.length)) {
                toastr && toastr.warning('Vui lòng thêm ít nhất một người phê duyệt');
                return false;
            }
            return true;
        }

        function aotbhaeMaybeAddHrManager(rowData, $tr) {
            if (!_aotbhae_hrDeptManager) return;
            var shiftEndTime = rowData.shiftEndTime || '';
            if (!shiftEndTime) return;
            var shiftEndDate = new Date(shiftEndTime.replace(' ', 'T'));
            if (isNaN(shiftEndDate.getTime())) return;
            if (new Date() <= shiftEndDate) return;
            if (!rowData.approvers) rowData.approvers = [];
            var mgr = _aotbhae_hrDeptManager;
            var alreadyAdded = rowData.approvers.some(function (a) { return a.personId === mgr.personId; });
            if (!alreadyAdded) {
                rowData.approvers.push({ personId: mgr.personId || '', localName: mgr.localName || '', empId: mgr.empId || '' });
                $tr.find('.aotbhae-approver-list').html(aotbhaeRenderApproverListHtml(rowData.approvers));
                toastr && toastr.info('Đã tự động thêm Trưởng bộ phận nhân sự (' + (mgr.localName || '') + ') vào danh sách phê duyệt vì đã quá giờ kết thúc ca');
            }
        }

                otTypeNo: '310',

                otToTime: ctx.otToTime,

                deductYn: ctx.rowData.deductYn || '0',
                usecarYn: ctx.rowData.usecarYn || '0',
                carAddress: ctx.rowData.carAddress || '',
                carAddressDetail: ctx.rowData.carAddressDetail || '',
                approvers: (ctx.rowData.approvers || []).map(function (a) {
                    return { personId: a.personId, localName: a.localName, empId: a.empId };
                })
            };
        }

                otApplyHour: '', applyOtRemark: '', otTotalMonth: '', otTotalYear: '',
                affirmFlag: '', affirmStr: '', createdBy: '', updatedBy: '', deductYn: '0',
                usecarYn: '0', carAddress: '', carAddressDetail: '', approvers: []
            };
            _aotbhae_addedRows.unshift(newRow);
            if (_aotbhae_table) {
                var currentData = _aotbhae_table.data().toArray();
                _aotbhae_table.clear().rows.add([newRow].concat(currentData)).draw();
            }
        };

            if (typeof EmployeeSearchModal !== 'undefined') {

                alert(_aotbhae_i18n.noEmpComp);

        window.aotbhaeEmpInputKeydown = function (e, input) {

                e.preventDefault();

        window.aotbhaeOpenApplyDetail = function (applyNo, applyType) {
            vaotOpenApplyDetail(applyNo, applyType, { detailApiUrl: '/ar/attendanceMintenance/api/overtime/detailOver' });
        };

        window.aotbhaeToggleCheckAll = function (chkAll) {
            $('#aotbhae_dataTable tbody tr').each(function () {
                $(this).find('.aotbhae-row-chk').prop('checked', $(chkAll).is(':checked'));
            });
        };

        window.aotbhaeRemoveNewRow = function (btn, newRowId) {
            _aotbhae_addedRows = _aotbhae_addedRows.filter(function (r) { return r._newRowId !== newRowId; });
            if (_aotbhae_table) {
                _aotbhae_table.rows(function (idx, data) { return data && data._newRowId === newRowId; }).remove().draw(false);
            }
        };

        function aotbhaeCheckBatchTimeOverlap(payloadItems) {
            for (var i = 0; i < payloadItems.length; i++) {
                for (var j = i + 1; j < payloadItems.length; j++) {
                    var a = payloadItems[i].payload, b = payloadItems[j].payload;
                    if (a.personId !== b.personId) continue;
                    if (!a.otFromTime || !a.otToTime || !b.otFromTime || !b.otToTime) continue;
                    var aFrom = new Date(a.otFromTime.replace(' ', 'T') + ':00');
                    var aTo   = new Date(a.otToTime.replace(' ', 'T') + ':00');
                    var bFrom = new Date(b.otFromTime.replace(' ', 'T') + ':00');
                    var bTo   = new Date(b.otToTime.replace(' ', 'T') + ':00');
                    if (isNaN(aFrom.getTime()) || isNaN(aTo.getTime()) || isNaN(bFrom.getTime()) || isNaN(bTo.getTime())) continue;
                    if (aTo <= aFrom) aTo.setDate(aTo.getDate() + 1);
                    if (bTo <= bFrom) bTo.setDate(bTo.getDate() + 1);
                    if (aFrom < bTo && bFrom < aTo) return true;
                }
            }
            return false;
        }

        window.aotbhaeSaveChecked = function () {
            var rows = [];
            $('#aotbhae_dataTable tbody tr').each(function () {
                var $tr = $(this);
                if ($tr.find('.aotbhae-row-chk').is(':checked')) {
                    var rowData = _aotbhae_table ? _aotbhae_table.row($tr).data() : null;
                    if (rowData) rows.push({ $tr: $tr, rowData: rowData });
                }
            });
            if (rows.length === 0) { toastr && toastr.warning(_aotbhae_i18n.msgNoCheckedRows); return; }

            var payloads = [];
            for (var i = 0; i < rows.length; i++) {
                var item = rows[i];
                aotbhaeMaybeAddHrManager(item.rowData, item.$tr);
                var ctx = aotbhaeBuildSaveContext(item.$tr, item.rowData.applyNo || '', item.rowData.personId || '');
                if (!aotbhaeValidateSaveContext(ctx)) return;
                payloads.push({
                    payload: aotbhaeBuildSavePayload(item.rowData.applyNo || '', ctx),
                    isNew: !!item.rowData.isNew,
                    newRowId: item.rowData._newRowId || null,
                    isResubmit: !item.rowData.isNew && item.rowData.affirmFlag === '14014308'
                });
            }

            if (aotbhaeCheckBatchTimeOverlap(payloads)) {
                toastr && toastr.error('Các dòng dữ liệu bị trùng nhau về thời gian, xin kiểm tra lại!');
                return;
            }

            ProcessingModal.show();
            var totalRows = payloads.length;
            var saveItems = payloads.filter(function (it) { return !it.isResubmit; });
            var resubmitItems = payloads.filter(function (it) { return it.isResubmit; });
            var callsRemaining = (saveItems.length > 0 ? 1 : 0) + resubmitItems.length;
            var errors = [], successNewRowIds = [];

            function onCallDone() {
                if (--callsRemaining === 0) aotbhaeFinalizeBatchSave(totalRows, errors, successNewRowIds);
            }

            if (saveItems.length > 0) {
                $.ajax({
                    url: '/ar/attendanceMintenance/api/overtime/over/saveBatch',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(saveItems.map(function (it) { return it.payload; })),
                    success: function (res) {
                        if (res && res.success) {
                            saveItems.forEach(function (it) { if (it.newRowId) successNewRowIds.push(it.newRowId); });
                        } else {
                            errors.push((res && res.error) || 'Lỗi lưu dữ liệu');
                        }
                        onCallDone();
                    },
                    error: function () { errors.push('Lỗi khi gửi dữ liệu'); onCallDone(); }
                });
            }

            resubmitItems.forEach(function (item) {
                $.ajax({
                    url: '/ar/attendanceMintenance/api/overtime/over/resubmit',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(item.payload),
                    success: function (res) {
                        if (res && res.success) {
                            if (item.newRowId) successNewRowIds.push(item.newRowId);
                        } else {
                            errors.push((res && res.error) || 'Lỗi lưu dữ liệu');
                        }
                        onCallDone();
                    },
                    error: function () { errors.push('Lỗi khi gửi dữ liệu'); onCallDone(); }
                });
            });
        };

        function aotbhaeFinalizeBatchSave(total, errors, successNewRowIds) {
            ProcessingModal.hide();
            successNewRowIds.forEach(function (id) {
                _aotbhae_addedRows = _aotbhae_addedRows.filter(function (r) { return r._newRowId !== id; });
            });
            if (errors.length > 0) {
                errors.forEach(function (msg) { toastr && toastr.error(msg); });
            } else {
                toastr && toastr.success(_aotbhae_i18n.saveBatchSuccess.replace('{n}', total));
                if (_aotbhae_table) _aotbhae_table.ajax.reload(null, false);
            }
        }

        window.aotbhaeCancelBatch = function () {
            if (!_aotbhae_table) return;
            var applyNos = [];
            _aotbhae_table.rows().every(function () {
                var rowData = this.data();
                var $row = $(this.node());
                if ($row.find('.aotbhae-row-chk').is(':checked') && rowData && rowData.applyNo && !rowData.isNew) {
                    applyNos.push(rowData.applyNo);
                }
            });
            if (applyNos.length === 0) {
                toastr && toastr.warning(_aotbhae_i18n.noCancelSelected);
                return;
            }
            if (!confirm(_aotbhae_i18n.confirmCancelBatch.replace('{n}', applyNos.length))) {
                return;
            }
            ProcessingModal.show();
            $.ajax({
                url: '/ar/attendanceMintenance/api/overtime/over/cancel-batch',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ applyNos: applyNos }),
                success: function (res) {
                    ProcessingModal.hide();
                    if (res && res.success) {
                        toastr && toastr.success(_aotbhae_i18n.cancelBatchSuccess.replace('{n}', res.count || applyNos.length));
                        if (_aotbhae_table) _aotbhae_table.ajax.reload(null, false);
                    } else {
                        toastr && toastr.error((res && res.error) || 'Lỗi khi hủy đơn');
                    }
                },
                error: function () {
                    ProcessingModal.hide();
                    toastr && toastr.error('Lỗi khi gửi yêu cầu hủy đơn');
                }
            });
        };

        window.aotbhaeResubmitLine = function (btn, applyNo, rowPersonId) {
            if (!confirm(_aotbhae_i18n.confirmResubmit)) return;
            var $tr = $(btn).closest('tr');
            var rowData = _aotbhae_table ? _aotbhae_table.row($tr).data() : null;
            if (rowData) aotbhaeMaybeAddHrManager(rowData, $tr);
            var ctx = aotbhaeBuildSaveContext($tr, applyNo, rowPersonId);
            if (!aotbhaeValidateSaveContext(ctx)) return;
            var $btn = $(btn);
            var originalHtml = $btn.html();
            $btn.html('<i class="bx bx-loader bx-spin"></i>').prop('disabled', true);
            $.ajax({
                url: '/ar/attendanceMintenance/api/overtime/over/resubmit',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(aotbhaeBuildSavePayload(applyNo, ctx)),
                success: function (res) {
                    $btn.html(originalHtml).prop('disabled', false);
                    if (res && res.success) {
                        toastr && toastr.success(res.message || _aotbhae_i18n.resubmitSuccess);
                        if (_aotbhae_table) _aotbhae_table.ajax.reload(null, false);
                    } else {
                        toastr && toastr.error((res && res.error) || 'Lỗi lưu dữ liệu');
                    }
                },
                error: function () {
                    $btn.html(originalHtml).prop('disabled', false);
                    toastr && toastr.error('Lỗi khi gửi dữ liệu');
                }
            });
        };

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', aotbhaeBootPage);
        }
        if (typeof $ !== 'undefined') {
            $(document).ready(aotbhaeBootPage);
        } else {
            aotbhaeBootPage();
        }
    </script>
</template>
